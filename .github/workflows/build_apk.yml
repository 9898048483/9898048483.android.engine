name: Build and Sign Android APK Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Buildozer Android NDK Multi-Architecture APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libtool \
            pkg-config \
            autoconf \
            automake \
            zlib1g-dev \
            zip \
            unzip
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Cache Buildozer & NDK Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-ndk-r25b-${{ hashFiles('android-client/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-ndk-r25b-

      - name: Compile Release APK via Buildozer
        working-directory: ./android-client
        run: |
          buildozer -v android release

      - name: Align and Sign APK with Android Keystore
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./android-client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            APK_PATH=$(find bin/ -name "*.apk" | head -n 1)
            $ANDROID_HOME/build-tools/33.0.2/zipalign -v -p 4 "$APK_PATH" aligned-release.apk
            $ANDROID_HOME/build-tools/33.0.2/apksigner sign --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out bin/Token9898048483-release-signed.apk aligned-release.apk
            $ANDROID_HOME/build-tools/33.0.2/apksigner verify --verbose bin/Token9898048483-release-signed.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Token-9898048483-Android-Release-APK
          path: android-client/bin/*.apk
          retention-days: 30
