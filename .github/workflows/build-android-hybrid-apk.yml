name: Build Full Hybrid Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Standalone Hybrid UI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Build React / Vite Production Bundle
        run: npm run build

      - name: Package Embedded Web Assets & Hybrid APK
        run: node scripts/bundle-hybrid-apk.js

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
        continue-on-error: true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-secure-space-hybrid-apk
          path: |
            public/*.apk
            android/app/build/outputs/apk/**/*.apk
