name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography requests fastapi uvicorn
          if (Test-Path server/requirements.txt) { pip install -r server/requirements.txt }

      - name: Compile Standalone Windows Binary
        run: |
          if (-Not (Test-Path server)) { New-Item -ItemType Directory -Path server }
          if (-Not (Test-Path server/app.py)) { New-Item -ItemType File -Path server/app.py }
          pyinstaller --noconfirm --onefile --clean --name ai-secure-space-win64.exe server/app.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/ai-secure-space-win64.exe
          retention-days: 5
