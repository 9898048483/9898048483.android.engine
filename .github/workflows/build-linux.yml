name: Build Linux Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography requests fastapi uvicorn
          if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi

      - name: Compile Standalone Linux Binary
        run: |
          mkdir -p server
          touch server/app.py
          pyinstaller --noconfirm --onefile --clean --name ai-secure-space-linux-x86_64 server/app.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/ai-secure-space-linux-x86_64
          retention-days: 5
