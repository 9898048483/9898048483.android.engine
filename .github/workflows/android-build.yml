name: Build Hybrid Android APK (200MB+)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-android-apk:
    name: Build & Package Autonomous APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Using Node 22 to match the environment
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build UI, AI, ZK Assets & Bundle APK
        # This will run the Vite build, generate ZK proofs, and package the 205MB+ APK using scripts/bundle-hybrid-apk.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify APK Generation
        run: |
          echo "Verifying APK generation and sizes..."
          ls -lh dist/*.apk public/*.apk
          
      - name: Upload Hybrid Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-hybrid-release-apk
          path: |
            public/app-hybrid-release.apk
            public/app-hybrid-release.apk.sha256
            public/app-hybrid-release.apk.sha512
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            public/debug.apk
            public/debug.apk.sha256
            public/debug.apk.sha512
          retention-days: 7
