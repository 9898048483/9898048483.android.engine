name: Build Autonomous Hybrid APK (200MB+)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build & Package Autonomous APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        # Using npm install instead of npm ci in case package-lock.json is out of sync
        run: npm install

      - name: Build UI, AI, ZK Assets & Bundle APK
        # Runs the vite build and standalone APK bundler
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify APK Generation
        run: |
          echo "Verifying APK generation and sizes..."
          ls -lh dist/*.apk public/*.apk || true
          
      - name: Upload Hybrid Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-hybrid-release-apk
          path: |
            public/app-hybrid-release.apk
            public/app-hybrid-release.apk.sha256
            public/app-hybrid-release.apk.sha512
          retention-days: 7
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            public/debug.apk
            public/debug.apk.sha256
            public/debug.apk.sha512
          retention-days: 7
          if-no-files-found: ignore
